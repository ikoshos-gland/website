<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mertoshi</title>

  <!-- Preconnect for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://prod.spline.design" crossorigin>
  <link rel="preload" as="image" href="/brain-loader.png">
  <link rel="icon" type="image/png" href="/brain-loader.png" />



  <!-- Fonts - using display=swap for better performance -->
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Great+Vibes&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital,wght@0,400;1,400&family=Cinzel:wght@400;500;600;700&display=swap"
    rel="stylesheet">



  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }

    .font-great-vibes {
      font-family: 'Great Vibes', cursive;
    }

    .font-instrument {
      font-family: 'Instrument Serif', serif;
    }

    .font-mono {
      font-family: 'Space Mono', monospace;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Reduce motion for users who prefer it */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      html {
        scroll-behavior: auto;
      }
    }

    /* Line clamp utilities for mobile */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-[#0E0F11] text-[#A1A1A6]">
  <div id="root" style="position: relative; z-index: 1;"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
